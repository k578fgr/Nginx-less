user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
    # multi_accept on;
}

http {
    log_format  logz '$remote_addr - [$time_local] '
                        '"$request" $status ';

    access_log /var/log/nginx/nip.access.log;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    auth_basic "Restricted Content";
    auth_basic_user_file /etc/nginx/.htpasswd;

    map $request_uri $browser {
        default "";
        ~*chrome "Chrome";
        ~*firefox "Firefox";
        ~*opera "Opera";

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;  # Включаем конфигурацию для виртуальных хостов
}