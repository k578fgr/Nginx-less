Ограничить доступ

allow/deny
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    deny all;

Аргументом данной директивы выступает число в мегабайтах или килобайтах с приставками m или k, соответственно, либо без приставки (в этом случае размер тела устанавливается в байтах). Примеры валидных значений:

    128m
    4096k
    1024
    0


  #добавление средств авторизации

    auth_basic - позволяет либо отключить аутентификацию 
    (для этого используется специальное значение off), 
    либо задать текст, который выводится при входе на страницу (к примеру, "Welcome to Area 52");
    
    auth_basic_user_file - определяет путь, где хранится файл с данными для входа.

Для работы модуля требуется указывать обе директивы.

Остановимся на второй директиве поподробнее:

    Имя данного файла может быть либо относительное (от директории, в которой хранится основной конфигурационный файл nginx - к примеру, htpasswd приведет на /etc/nginx/htpasswd), либо абсолютное.
    Содержимое файла должно быть в формате Apache2 htpasswd.

Формат файла htpasswd

Для установки
apt install apache2-utils

htpasswd - шифрование пароля
htpasswd -c /etc/nginx/htpasswd $USERNAME - данная команда создаст (за это отвечает ключ -c) новый файл и запишет в него пароль, который запросит в интерактивном режиме утилита для пользователя с ником $USERNAME.

Если же требуется добавить новую запись в уже существующий файл, то можно сделать это, вызвав htpasswd /etc/nginx/htpasswd $USERNAME_NEW.

Использует метод MD5 для хеширования

Утилита openSsl - позволяет делать большое количество 
криптографических операций

А из под коробки
Для этого можно воспользоваться следующей командой и получить 
такой же результат, как и при работе htpasswd:
echo "sammy:$(openssl passwd -apr1)" >> /etc/nginx/htpasswd

Равно как и с htpasswd, пароль для команды будет запрошен в интерактивном режиме и в файл будет добавлена новая запись - не важно, существовал файл ранее или нет.

Кроме использования хешей, можно записывать пароль в нехешированном виде. Для этого используется формат из RFC-2307, который позволяет описать формат хеширования в фигурных скобках. Так, для хранения пароля в открытом виде используется следующий формат:

test:{PLAIN}test

На примере - если вам нужно переопределить, куда нужно писать error_log для конкретного server, хотя у вас уже определено это в main, то 
вам просто нужно добавить директиву access_log внутрь server.

#Return

Директива return может быть знакома тем людям, которые программируют в той или иной степени на любом языке программирования. Там, как правило, она возвращает результат выполнения функции, в nginx же данная директива либо возвращает какой-то текст (может использоваться для отладки), 
либо делает редирект на другую ссылку (при использовании HTTP кодов из семейства 300-х).


    return 200 "hello from nginx"; - вернет соответствующий текст с кодом 200;
    return 301 http://example.com - вызовет redirect с кодом 301 на соответствующую ссылку.

Частый кейс использования - автоматический перевод пользователя с www поддомена или перевод на HTTPS версию сайта. 
Особенно популярный кейс - редирект всех доменов по умолчанию на HTTPS - return 301 https://$host$request_uri

proxy_pass и fastcgi_pass
Пример использования директивы - proxy_pass http://127.0.0.1:9000;

proxy_set_header - позволяет задать заголовок, который будет передан через proxy_pass. Пример использования - 
proxy_set_header Host $proxy_host;.

proxy_hide_header - позоволяет скрыть конкретный заголовок, который передал сервер клиенту обратно. Пример - 
proxy_hide_header Content-Secure-Policy;.

Во всех этих директивах можно использовать переменные, ровно как и обычные строки и даже строить другие строки из переменных. 
К примеру, add_header X-Forwarded-For $host;


upstream

В случае, когда у вас есть несколько инстансов приложения, вы можете использовать директиву upstream

upstream backend {
    server 127.0.0.1:8080;
    server 127.0.0.1:8081 backup;
}
При такой настройке запросы будут циклически пробрасываться между двумя сервисами по алгоритму 
балансировки round-robin

Виды балансировок

    backup - отмечает сервер как запасной. Суть данной директивы в том, что на backup server запросы отправляются только тогда, когда основной сервер не отвечает.
    weight - позволяет задать для сервера вес, то есть то, какую долю запросов может обрабатывать сервер, изменяя алгоритм балансировки на weighted round-robin. Процент отправляемых сообщений можно посчитать, просуммировав количество всех весов и разделив на это значение вес конкретного сервера. По умолчанию это значение равняется 1. Пример использования - server 127.0.0.1:8080 weigh=3;. Если в данном случае у нас есть второй сервер без веса и без директивы backup, то на первый сервер у нас будет идти 75% трафика, а на второй - 25%.
    max_conns - ограничивает количество одновременных подключений к серверу. Значение 0 снимает ограничение, и это значение выставлено по умолчанию. Пример использования - server 127.0.0.1:8081 max_conns=10 backup;.
    max_fails - определяет, через сколько неуспешных отправленных запросов данный сервер отмечается как проблемный и временно отключается из балансировки на период, указанный в другой директиве - fail_timeout.

Для того чтобы иметь возможность все-таки использовать DNS-имена, используют директиву resolver с передачей DNS-сервера, который должен использоваться для DNS-запросов. 
Пример использования - resolver 1.1.1.1;.


    location / {
        auth_basic "closed site";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location /noauth/ {
            auth_basic off;
        }
    }e

Этот фрагмент конфигурации Nginx отключает базовую аутентификацию для запросов, которые начинаются с /noauth/.

Когда клиент делает запрос к URL, который начинается с /noauth/, Nginx не будет требовать от клиента предоставления учетных данных для аутентификации (например, имя пользователя и пароль). 

Это полезно, если вы хотите предоставить доступ к определенным ресурсам без необходимости аутентификации. Например, для публичных файлов или страниц, которые не требуют защиты паролем.
